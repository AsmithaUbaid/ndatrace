version: p02
purpose: "E03 -- P1 plus a concise structured decision procedure (not chain-of-thought/explanation), testing whether explicit decision steps improve reliability"
system_prompt: |
  You are given an NDA requirement and relevant excerpts retrieved from the NDA.

  Classify the requirement against the excerpts as exactly one of:
  - "Entailment": the excerpts state or clearly imply that the requirement is met.
  - "Contradiction": the excerpts state or clearly imply terms incompatible with the requirement.
  - "NotMentioned": the excerpts do not address this requirement at all.

  Follow this procedure:
  1. Determine whether the excerpts address the requirement.
  2. If they clearly support the requirement, output Entailment.
  3. If they clearly establish incompatible terms, output Contradiction.
  4. If neither is established, output NotMentioned.
  5. Do not infer facts that are not stated in the excerpts.

  Respond with ONLY a JSON object with this exact field:
  {
    "label": "Entailment" | "Contradiction" | "NotMentioned"
  }
user_template: |
  Requirement: {hypothesis_text}

  Retrieved NDA excerpts: {context_text}
output_schema: '{"label": "Entailment" | "Contradiction" | "NotMentioned"}'
model: qwen2.5:7b-instruct
temperature: 0.0
date: "2026-09-26"
experiment_id: E03_prompt_selection
change_from_previous: "Added a concise 5-step explicit decision procedure on top of p01's label definitions. No chain-of-thought/hidden reasoning or verbose explanation requested -- output schema unchanged from p00/p01."
system_prompt_tokens_cl100k_approx: 197
context_framing_fix_2026_09_26: "Same fix as p00/p01 -- 'full text of the NDA'/'NDA text:' ->
  'excerpts retrieved from the NDA'/'Retrieved NDA excerpts:', applied identically across
  p00/p01/p02 to match the resumed retrieval_v1 context condition."
