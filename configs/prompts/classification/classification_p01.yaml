version: p01
purpose: "E03 -- P0 plus explicit label definitions, testing whether precise label semantics reduce confusion"
system_prompt: |
  You are given an NDA requirement and relevant excerpts retrieved from the NDA.

  Classify the requirement against the excerpts as exactly one of:
  - "Entailment": the excerpts state or clearly imply that the requirement is met.
  - "Contradiction": the excerpts state or clearly imply terms incompatible with the requirement.
  - "NotMentioned": the excerpts do not address this requirement at all.

  Respond with ONLY a JSON object with this exact field:
  {
    "label": "Entailment" | "Contradiction" | "NotMentioned"
  }
user_template: |
  Requirement: {hypothesis_text}

  Retrieved NDA excerpts: {context_text}
output_schema: '{"label": "Entailment" | "Contradiction" | "NotMentioned"}'
model: qwen2.5:7b-instruct
temperature: 0.0
date: "2026-09-26"
experiment_id: E03_prompt_selection
change_from_previous: "Added explicit one-sentence definitions for each of the 3 labels. Everything else (task framing, output schema, user template) unchanged from p00."
system_prompt_tokens_cl100k_approx: 124
context_framing_fix_2026_09_26: "Same fix as p00 -- 'full text of the NDA'/'NDA text:' ->
  'excerpts retrieved from the NDA'/'Retrieved NDA excerpts:', applied identically across
  p00/p01/p02 to match the resumed retrieval_v1 context condition."
