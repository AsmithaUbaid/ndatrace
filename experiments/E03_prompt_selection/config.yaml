experiment_id: E03_prompt_selection
status: COMPLETE  # resumed post-E06; original 88/150 partial P0 attempt (full-context) SUPERSEDED
                  # -- see results/SUPERSEDED_run_E03_prompt_selection_p00.md. Resumed run used
                  # the frozen retrieval_v1 context (BM25/clause_256/top-20/rerank/top-5), all
                  # 150 cases, for P0/P1/P2. classification_prompt_v1 = P0 FROZEN -- see
                  # configs/prompts/classification/classification_prompt_v1.yaml and summary.md.
frozen_prompt: classification_prompt_v1  # = p00, unchanged content
frozen_prompt_metrics:
  p00: {accuracy: 0.5267, macro_f1: 0.5070, contradiction_recall: 0.2200, entailment_recall: 0.56, notmentioned_recall: 0.80, parse_valid_rate: 1.0}
  p01: {accuracy: 0.5133, macro_f1: 0.4481, contradiction_recall: 0.0600, entailment_recall: 0.60, notmentioned_recall: 0.88, parse_valid_rate: 1.0}
  p02: {accuracy: 0.4800, macro_f1: 0.4035, contradiction_recall: 0.0200, entailment_recall: 0.52, notmentioned_recall: 0.90, parse_valid_rate: 1.0}
dataset_manifest: TRAIN_PROMPT_v1
split_role: development   # Role A, TRAIN only
purpose: controlled_prompt_selection

manifest:
  path: TRAIN_PROMPT_v1.json
  seed: 500
  target_per_class: 50
  max_cases_per_doc_per_class: 2
  total_cases: 150
  verified_class_balance: {Entailment: 50, Contradiction: 50, NotMentioned: 50}
  context_condition: retrieval_v1  # frozen in E06 -- see retrieval_config below
  context_source: TRAIN_PROMPT_v1_RETRIEVED_retrieval_v1.json

retrieval_config:  # frozen in E06, unchanged for all of P0/P1/P2 -- not an E03 variable
  method: bm25
  chunk_method: clause
  chunk_size: 256
  chunk_overlap: 50
  candidate_pool_size: 20
  top_k: 5
  reranking: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-12-v2

model:
  provider: local
  model: qwen2.5:7b-instruct
  temperature: 0.0
  note: FIXED -- the frozen primary local model from E01/E02. No other model runs in E03.

prompts:
  p00:
    path: ../../configs/prompts/classification/classification_p00.yaml
    role: minimal direct baseline
  p01:
    path: ../../configs/prompts/classification/classification_p01.yaml
    role: explicit label definitions
  p02:
    path: ../../configs/prompts/classification/classification_p02.yaml
    role: structured decision procedure
  p03:
    status: NOT RUN -- frozen to P0/P1/P2 before resuming, per reconstruction brief section 14

output_schema: '{"label": "Entailment" | "Contradiction" | "NotMentioned"}'

model_calls: LOCAL ONLY -- qwen2.5:7b-instruct via Ollama, 450 calls total (150 cases x 3 prompts)
api_calls: NONE
hosted_calls: NONE -- E03 is local-only by design

outputs:
  - TRAIN_PROMPT_v1.json
  - TRAIN_PROMPT_v1_RETRIEVED_retrieval_v1.json / _GOLD.json
  - results/run_E03_prompt_selection_p0{0,1,2}.jsonl (450 traceable prediction records)
  - results/prompt_failure_analysis.csv, prompt_failure_analysis_summary.json
  - E03_prompt_selection.ipynb
