  2: "all adversarial semantic-change negative controls remain non-matches"
  3: "no unexplained v1-valid evidence becomes invalid"
  4: "manual review of EVERY changed historical case confirms formatting-only behaviour"
  5: "no material false-positive matching found"
  6: "E13/E12/E11 sensitivity effects fully documented"
